spring.application.name=ticket-reservation

spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_reservation
spring.datasource.username=ticket_reservation
spring.datasource.password=ticket_reservation

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# How long a PENDING reservation holds its seats before the scheduler releases them.
reservation.hold-duration=PT15M
reservation.optimistic-max-retries=5
reservation.optimistic-retry-backoff=PT0.02S
reservation.expiration-check-interval-ms=30000

management.endpoints.web.exposure.include=health,info
